<link rel="preload" as="image" href="assets/img/hero5.jpg">

<title>Academic Profile</title>
<link rel="icon" type="image/png" href="assets/img/favicon.jpg">
  
<meta property="og:title" content="Academic Profile">
<meta property="og:description" content="Portfolio & Projects">

<body>
<div class="layout">


<aside class="sidebar">
<div class="profile">
<img src="assets/img/avatar.jpg" class="avatar">
<h2>Phan Anh</h2>
<p class="role">Research Student</p>
</div>


<div id="menu"></div>

</aside>


<main class="main">
<section class="hero" id="hero">
<div class="hero-overlay"></div>
<div class="hero-content">
<h1>Hi, I'm Phan Anh</h1>
<p>Information Systems • Data Analytics • English</p>
<a href="CV.pdf" class="btn" download>Download CV</a>
</div>
</section>
</main>


</div>

<script>
const heroImages = [
  "assets/img/hero1.jpg",
  "assets/img/hero2.jpg",
  "assets/img/hero3.jpg",
  "assets/img/hero4.jpg",
  "assets/img/hero5.jpg"
];

let current = 0;
const hero = document.getElementById("hero");

function changeHero(){
  hero.style.backgroundImage = `url('${heroImages[current]}')`;
  hero.style.backgroundSize = "cover";
  hero.style.backgroundPosition = "center";
  hero.style.transition = "background-image 1s ease-in-out";
  current = (current + 1) % heroImages.length;
}

changeHero(); // load ảnh đầu
setInterval(changeHero, 5000); // 5s đổi ảnh
</script>

<script src="assets/js/main.js"></script>

<script>
fetch("/assets/components/menu.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("menu").innerHTML = data;

    const links = document.querySelectorAll("#menu a");

    // URL hiện tại
    let currentPath = window.location.pathname;

    // chuẩn hóa path
    currentPath = currentPath
      .replace(/index\.html$/, "")
      .replace(/\.html$/, "")
      .replace(/\/$/, "");

    links.forEach(link => {
      let linkPath = link.getAttribute("href");

      linkPath = linkPath
        .replace(/index\.html$/, "")
        .replace(/\.html$/, "")
        .replace(/\/$/, "");

      if(linkPath === currentPath){
        link.classList.add("active");
      }
    });
  });
</script> 
  
  
</body>
</html>
