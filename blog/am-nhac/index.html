<!DOCTYPE html> <html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Collection</title>

<link rel="stylesheet" href="/css/style.css">
    
</head>

<body>

<div class="layout">

  <!-- ===== Sidebar ===== -->
  <aside id="sidebar" class="sidebar"></aside>

    <!-- ===== Main ===== -->
    <main class="main">

        <div class="music-container">

            <!-- Header -->
            <section class="music-header">

                <div>

                    <h1>Music Collection</h1>

                    <p>
                        A collection of songs that have accompanied
                        different stages of my life.
                    </p>

                </div>

                <a
                    class="spotify-btn"
                    href="https://open.spotify.com/playlist/3LTt3xSndwWF7vkIWRTpC3"
                    target="_blank">

                    Open Playlist ↗

                </a>

            </section>

            <!-- Toolbar -->

            <section class="toolbar">

                <input
                    type="text"
                    id="search"
                    placeholder="Search song or artist...">

                <span id="songCount">
                    Loading...
                </span>

            </section>

            <!-- Table -->

            <section class="table-wrapper">

                <table id="songTable">

                    <thead>

                        <tr>

                            <th data-sort="id">
                                #
                            </th>

                            <th data-sort="song">
                                Song
                            </th>

                            <th data-sort="artist">
                                Artist
                            </th>

                            <th>
                                Listen
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <!-- script.js render -->

                    </tbody>

                </table>

            </section>

        </div>

    </main>

</div>


  <!-- ===== Main JS ===== -->
<script src="/js/main.js"></script>

</body>
</html>
